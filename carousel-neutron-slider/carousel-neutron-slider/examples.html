<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutron Slider jQuery Plugin Example</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: 'Inter';
            padding: 2rem;
        }
        html,* { font-family: 'Inter'; }
body { background-color: #fafaf8; line-height:1.6;}
.lead { font-size: 1.5rem; font-weight: 300;background: linear-gradient(to right, #000000 0%, #000000 50%,#999999 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color:transparent; }
.container { margin: 20px auto; max-width: 960px; }
h1 {
  background: linear-gradient( 120deg, #bd34fe 30%, #41d1ff );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

    </style>
</head>
<body>
    <div class="container">
<h1>Neutron Slider jQuery Plugin Example</h1>
<p class="lead">A lightweight, mobile-first jQuery carousel plugin for creating responsive and touch-enabled content sliders.</p>
<h2>View the demo page on a mobile device</h2>
    <div class="slider-container">
        <div class="neutron-slider">
            <div><img src="https://placehold.co/600x400?text=Slide+1"></div>
            <div><img src="https://placehold.co/600x400?text=Slide+2"></div>
            <div><img src="https://placehold.co/600x400?text=Slide+3"></div>
            <div><img src="https://placehold.co/600x400?text=Slide+4"></div>
            <div><img src="https://placehold.co/600x400?text=Slide+5"></div>
        </div>
    </div>
</div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="dist/index.umd.js"></script>
    <script>
        $(document).ready(function(){
            $('.neutron-slider').neutronSlider({
                slidesToShow: 3,
                centerMode: true,
                gap:20,
                dots: false,
                loop: true,
                autoplay: true
            });
        });
    </script>

</body>
</html>
